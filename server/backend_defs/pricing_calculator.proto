syntax = "proto2";

service Pricing_Calculator {
    // Client Interface requests a price for a spot
    rpc getPrice (PriceReq) returns (PriceResp) {}

}

// Price Request specifies which lot and available spots
message PriceReq {
    required string lotID = 1;
    repeated string spotID = 2;
}

// Price Response returns the price for each available spot in the specified lot
message PriceResp {
    repeated float price = 1;
    required string lotID = 2;
    repeated string spotID = 3;
}