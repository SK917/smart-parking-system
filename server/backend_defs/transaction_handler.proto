syntax = "proto2";

service Transaction_Handler {
    // Makes a payment for a reservation
    rpc makePayment (transReq) returns (transResp) {}
}

// Consists of IDs for the user and reservation, payment info, and the value of the transaction
message transReq {
    required int32 resID = 1;
    required string paymentInfo = 2;
    required string plateNum = 3;
    required float val = 4;
}

// Consists of reservation and user ID, and the generated transaction ID, and a success/fail indicator
message transResp {
    required int32 resID = 1;
    required int32 transID = 2;
    required string plateNum = 3;
    required bool success = 4;
    optional string errorCode = 5;
}